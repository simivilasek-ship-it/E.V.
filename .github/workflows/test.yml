name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            portaudio19-dev ffmpeg python3-tk \
            xvfb x11-utils

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install \
            requests psutil edge-tts \
            customtkinter \
            SpeechRecognition \
            fastapi uvicorn \
            mcp \
            pytest pytest-timeout pytest-cov \
            ruff

      - name: Install linter
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check . --output-format=github
        continue-on-error: true  # neblokuj CI dokud neopravíme všechny chyby

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1

      - name: Run tests
        run: |
          python -m pytest test_jarvis.py -q --timeout=30 \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-omit="test_*,setup.py"
        env:
          DISPLAY: ":99"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: jarvis.log
          if-no-files-found: ignore
