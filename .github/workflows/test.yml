name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            portaudio19-dev ffmpeg python3-tk \
            xvfb x11-utils tesseract-ocr

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: UTF-8 encoding check
        run: python scripts/check_utf8.py

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy .

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1

      - name: Run unit tests
        run: |
          python -m pytest tests/ test_jarvis.py -q --timeout=30 \
            -m "not integration" \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 \
            --cov-omit="test_*,setup.py,web/*,gui_legacy/*,scripts/split_dashboard.py"
        env:
          DISPLAY: ":99"

      - name: Run E2E / integration API tests
        run: |
          python -m pytest tests/ -m integration -q --timeout=60 -v
        env:
          DISPLAY: ":99"
          JARVIS_TEST_MODE: "1"
          JARVIS_ACTIVITY_DB: /tmp/jarvis-test-activity.db
          JARVIS_MISSIONS_DB: /tmp/jarvis-test-missions.db

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: jarvis.log
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jarvis:ci .

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [web]
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build Next.js
        run: npm run build
      - name: Start server and run E2E
        run: |
          npm run start &
          SERVER_PID=$!
          npx wait-on http://localhost:3000 --timeout 30000
          JARVIS_BASE_URL=http://localhost:3000 npx playwright test --reporter=github
          kill $SERVER_PID || true
        env:
          NODE_ENV: production

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t jarvis:smoke .
      - name: Run container health check
        run: |
          docker run -d --name jarvis_smoke \
            -e JARVIS_BIND_HOST=0.0.0.0 \
            -e JARVIS_API_AUTH_REQUIRED=0 \
            -p 8002:8002 \
            jarvis:smoke
          # Wait for the container to start
          sleep 15
          # Check health endpoint
          curl -f http://localhost:8002/api/health || \
          curl -f http://localhost:8002/health || \
          (docker logs jarvis_smoke && exit 1)
          docker stop jarvis_smoke
          docker rm jarvis_smoke
