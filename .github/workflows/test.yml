name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            portaudio19-dev ffmpeg python3-tk \
            xvfb x11-utils tesseract-ocr

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Typecheck (mypy)
        run: mypy .

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1

      - name: Run unit tests
        run: |
          python -m pytest tests/ test_jarvis.py -q --timeout=30 \
            -m "not integration" \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=70 \
            --cov-omit="test_*,setup.py,web/*,gui_legacy/*,scripts/split_dashboard.py"
        env:
          DISPLAY: ":99"

      - name: Run E2E / integration API tests
        run: |
          python -m pytest tests/ -m integration -q --timeout=60 -v
        env:
          DISPLAY: ":99"
          JARVIS_TEST_MODE: "1"
          JARVIS_ACTIVITY_DB: /tmp/jarvis-test-activity.db
          JARVIS_MISSIONS_DB: /tmp/jarvis-test-missions.db

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: jarvis.log
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jarvis:ci .
