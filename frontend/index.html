<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS v3.0</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #050a15;
    --bg2:     #0a1628;
    --bg3:     #0d1f3c;
    --fg:      #e3f2fd;
    --fg2:     #90caf9;
    --border:  #1a3a5c;
    --cyan:    #00e5ff;
    --blue:    #1976d2;
    --blue2:   #1565c0;

    --orb-idle:      #1565c0;
    --orb-listening: #00e5ff;
    --orb-thinking:  #7c4dff;
    --orb-speaking:  #00b0ff;
  }

  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── HEADER ─────────────────────────────────────── */
  #header {
    flex: 0 0 40px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 18px;
    font-family: 'Courier New', monospace;
  }
  #header-title { color: var(--cyan); font-size: 13px; letter-spacing: 5px; }
  #header-right  { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  #status-wrap   { display: flex; align-items: center; gap: 6px; font-size: 10px;
                   color: var(--fg2); font-family: 'Courier New', monospace; }
  #status-dot    { width: 7px; height: 7px; border-radius: 50%;
                   background: var(--border); transition: background .4s; }
  #model-label   { font-size: 9px; color: var(--border);
                   font-family: 'Courier New', monospace; }

  /* ── ORB SEКCE ──────────────────────────────────── */
  #orb-section {
    flex: 0 0 46vh; min-height: 280px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #091428 0%, var(--bg) 72%);
  }

  /* HUD rohové čáry */
  #orb-section::before, #orb-section::after,
  #hud-bl, #hud-br {
    content: ""; position: absolute;
    width: 16px; height: 16px;
    border-color: var(--cyan); border-style: solid; opacity: .5;
  }
  #orb-section::before { top: 10px; left: 14px;
    border-width: 1px 0 0 1px; }
  #orb-section::after  { top: 10px; right: 14px;
    border-width: 1px 1px 0 0; }
  #hud-bl { bottom: 10px; left: 14px;
    border-width: 0 0 1px 1px; }
  #hud-br { bottom: 10px; right: 14px;
    border-width: 0 1px 1px 0; }

  #orb-canvas { display: block; cursor: default; }

  #state-label {
    position: absolute; bottom: 18px;
    font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 3px;
    color: var(--orb-idle); transition: color .5s;
  }

  /* ── TOOLBAR ─────────────────────────────────────── */
  #toolbar {
    flex: 0 0 36px; background: var(--bg2);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 6px;
  }
  .tb-btn {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--fg2); font-size: 10px; padding: 3px 10px;
    border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace;
    transition: border-color .2s, color .2s; letter-spacing: 1px;
  }
  .tb-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .tb-btn.active { border-color: var(--cyan); color: var(--cyan); background: #091428; }
  #vol-label { margin-left: auto; font-size: 9px; color: var(--border);
               font-family: 'Courier New', monospace; }

  /* ── CHAT ────────────────────────────────────────── */
  #chat {
    flex: 1; overflow-y: auto; padding: 10px 0 4px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 3px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { padding: 5px 18px; display: flex; flex-direction: column; gap: 2px;
         animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(3px); } to { opacity:1; } }

  .msg-meta { font-size: 9px; color: var(--border);
              font-family: 'Courier New', monospace;
              display: flex; align-items: center; gap: 5px; }

  .msg.user { align-items: flex-end; }
  .msg.user .msg-meta { flex-direction: row-reverse; }
  .msg.user .bubble {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 10px 10px 3px 10px; color: var(--fg);
  }
  .msg.jarvis { align-items: flex-start; }
  .msg.jarvis .bubble {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px 10px 10px 3px; color: var(--fg2);
    border-left-color: var(--blue);
  }
  .msg.system { align-items: center; }
  .msg.system .bubble { background: transparent; border: none;
    color: var(--border); font-size: 10px; font-family: 'Courier New', monospace; }
  .msg.info   .bubble { color: var(--cyan); font-size: 10px;
    font-family: 'Courier New', monospace; background: transparent; border: none; }
  .msg.error  .bubble { color: #ef5350; font-size: 10px; background: transparent; border: none; }

  .bubble { max-width: 76%; padding: 7px 13px; font-size: 13px;
            line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .bubble code { font-family: 'Courier New', monospace; font-size: 11px;
                 color: var(--cyan); background: #080f20;
                 padding: 1px 5px; border-radius: 3px; }
  .bubble pre  { font-family: 'Courier New', monospace; font-size: 11px;
                 color: #80cbc4; background: #060d1a; padding: 8px 10px;
                 border-radius: 4px; overflow-x: auto;
                 border-left: 2px solid var(--blue); margin: 4px 0; }

  .stream-cursor::after { content: '▋'; animation: blink .7s step-end infinite;
                          color: var(--cyan); }
  @keyframes blink { 50% { opacity:0; } }

  /* ── PROGRESS ────────────────────────────────────── */
  #progress { height: 2px; background: var(--bg); flex-shrink: 0; overflow: hidden; }
  #progress-inner { height: 100%; width: 28%; background: var(--cyan);
                    position: relative; left: -28%; opacity: 0; }
  #progress-inner.active { opacity: 1; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0%{left:-28%} 100%{left:110%} }

  /* ── INPUT ───────────────────────────────────────── */
  #input-area {
    flex: 0 0 58px; background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
  }
  #mic-wrap {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--cyan);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg3); cursor: pointer; flex-shrink: 0;
    transition: background .2s, box-shadow .2s;
  }
  #mic-wrap:hover { background: var(--border);
    box-shadow: 0 0 12px rgba(0,229,255,.25); }
  #mic-icon { font-size: 18px; user-select: none; }

  #text-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); font-size: 13px; font-family: inherit;
    padding: 9px 14px; outline: none; transition: border-color .2s;
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  #text-input:focus { border-color: var(--cyan); }
  #text-input::placeholder { color: var(--border); }

  #send-btn {
    background: var(--blue2); border: none; color: var(--fg);
    width: 38px; height: 38px; border-radius: 6px; font-size: 18px;
    cursor: pointer; transition: background .2s;
    display: flex; align-items: center; justify-content: center;
  }
  #send-btn:hover { background: var(--blue); }
  #send-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* Boční HUD div */
  #hud-bl, #hud-br { z-index: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- HUD rohové prvky -->
  <div id="hud-bl"></div>
  <div id="hud-br"></div>

  <!-- HEADER -->
  <div id="header">
    <span id="header-title">J A R V I S</span>
    <div id="header-right">
      <div id="status-wrap">
        <span id="status-dot"></span>
        <span id="status-text">Připojování...</span>
      </div>
      <span id="model-label">—</span>
    </div>
  </div>

  <!-- ORB -->
  <div id="orb-section">
    <canvas id="orb-canvas"></canvas>
    <div id="state-label">● IDLE</div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <button class="tb-btn active" id="tts-btn">🔊 HLAS</button>
    <button class="tb-btn" id="clear-btn">🗑 LOG</button>
    <button class="tb-btn" id="memory-btn">🧠 PAMĚŤ</button>
    <span id="vol-label">—</span>
  </div>

  <!-- CHAT -->
  <div id="chat"></div>

  <!-- PROGRESS -->
  <div id="progress"><div id="progress-inner"></div></div>

  <!-- INPUT -->
  <div id="input-area">
    <div id="mic-wrap" title="Klikni nebo mezerník">
      <span id="mic-icon">🎤</span>
    </div>
    <input id="text-input" type="text"
           placeholder="Napiš příkaz pro JARVIS..." autocomplete="off" />
    <button id="send-btn">↵</button>
  </div>

</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ── BARVY ────────────────────────────────────────────
const BG_COLOR  = 0x050a15;
const ORB_STATE = {
  idle:      { color: 0x1565c0, dark: 0x0d47a1, speed: 0.18, spread: 1.6 },
  listening: { color: 0x00e5ff, dark: 0x006064, speed: 0.65, spread: 0.85 },
  thinking:  { color: 0x7c4dff, dark: 0x4527a0, speed: 2.4,  spread: 1.8 },
  speaking:  { color: 0x00b0ff, dark: 0x01579b, speed: 1.2,  spread: 1.9 },
};
const CSS_STATE = {
  idle:      { label: '● IDLE',      css: '#1565c0' },
  listening: { label: '● LISTENING', css: '#00e5ff' },
  thinking:  { label: '● THINKING',  css: '#7c4dff' },
  speaking:  { label: '● SPEAKING',  css: '#00b0ff' },
};

// ── THREE.JS SETUP ────────────────────────────────────
const canvas   = document.getElementById('orb-canvas');
const orbSec   = document.getElementById('orb-section');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.01, 100);
camera.position.z = 4.8;

// ── ČÁSTICE ───────────────────────────────────────────
const N        = 700;
const geometry = new THREE.BufferGeometry();
const pos      = new Float32Array(N * 3);
const col      = new Float32Array(N * 3);
const baseR    = new Float32Array(N);
const phase    = new Float32Array(N);
const speeds   = new Float32Array(N);
const tilt     = new Float32Array(N);
const axis     = new Float32Array(N);
const pulseP   = new Float32Array(N);

for (let i = 0; i < N; i++) {
  // Fibonacci rozmístění na sféře
  const golden = Math.PI * (3 - Math.sqrt(5));
  const y  = 1 - (i / (N - 1)) * 2;
  const r  = Math.sqrt(1 - y * y);
  const th = golden * i;
  const R  = 1.3 + Math.random() * 0.6;
  pos[i*3]   = R * r * Math.cos(th);
  pos[i*3+1] = R * y;
  pos[i*3+2] = R * r * Math.sin(th);
  baseR[i]   = R;
  phase[i]   = Math.random() * Math.PI * 2;
  speeds[i]  = 0.35 + Math.random() * 0.65;
  tilt[i]    = 0.18 + Math.random() * 0.64;
  axis[i]    = Math.random() * Math.PI;
  pulseP[i]  = Math.random() * Math.PI * 2;
  col[i*3] = col[i*3+1] = col[i*3+2] = 0.3;
}

geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(col, 3));

const mat  = new THREE.PointsMaterial(
  { size: 0.044, vertexColors: true, transparent: true, opacity: 0.88, sizeAttenuation: true });
const pts  = new THREE.Points(geometry, mat);
scene.add(pts);

// Vnější ring
const ringGeo = new THREE.TorusGeometry(2.3, 0.007, 8, 120);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x1a3a5c, transparent: true, opacity: 0.5 });
const ring    = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring);

// Druhý ring (přerušovaný)
const ring2Geo = new THREE.TorusGeometry(2.65, 0.005, 8, 80);
const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x0d1f3c, transparent: true, opacity: 0.4 });
const ring2    = new THREE.Mesh(ring2Geo, ring2Mat);
scene.add(ring2);

// ── STAV ─────────────────────────────────────────────
let currentState = 'idle';
let curColor     = new THREE.Color(0x1565c0);
let tgtColor     = new THREE.Color(0x1565c0);
let rotSpeed     = 0.001;

// ── RESIZE ────────────────────────────────────────────
function resize() {
  const w = orbSec.clientWidth, h = orbSec.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(orbSec);

// ── ANIMACE ───────────────────────────────────────────
function animate(t) {
  requestAnimationFrame(animate);
  const ts  = t * 0.001;
  const cfg = ORB_STATE[currentState] || ORB_STATE.idle;

  curColor.lerp(tgtColor, 0.045);

  const posArr = geometry.attributes.position;
  const colArr = geometry.attributes.color;

  for (let i = 0; i < N; i++) {
    const ph  = phase[i] + ts * cfg.speed * speeds[i];
    const R   = baseR[i] * cfg.spread;
    const tl  = tilt[i];
    const ax  = axis[i];
    let x, y, z;

    if (currentState === 'thinking') {
      // Elektronové orbitální dráhy — rychlé kroužení
      const orbit = ph * 3.2;
      const phi   = phase[i] * Math.PI;
      const puls  = 1 + 0.1 * Math.sin(ts * 2.5 + phase[i]);
      x = R * puls * Math.sin(phi) * Math.cos(orbit);
      y = R * puls * Math.sin(phi) * Math.sin(orbit);
      z = R * puls * Math.cos(phi) + 0.25 * Math.sin(ts * 3 + phase[i]);

    } else if (currentState === 'speaking') {
      // Pulzují ven od středu
      const puls  = 1 + 0.25 * Math.sin(ts * 1.5 + pulseP[i]);
      const x3    = R * puls * Math.cos(ph);
      const y3    = R * puls * Math.sin(ph) * tl;
      const z3    = R * puls * Math.sin(ph) * (1 - tl);
      x = x3 * Math.cos(ax) - z3 * Math.sin(ax);
      y = y3;
      z = x3 * Math.sin(ax) + z3 * Math.cos(ax);

    } else if (currentState === 'listening') {
      // Stahují se ke středu — menší orbit
      const pulse = 1 + 0.07 * Math.sin(ts * 3.5 + phase[i]);
      const x3    = R * pulse * Math.cos(ph);
      const y3    = R * pulse * Math.sin(ph) * tl;
      const z3    = R * pulse * Math.sin(ph) * (1 - tl);
      x = x3 * Math.cos(ax) - z3 * Math.sin(ax);
      y = y3;
      z = x3 * Math.sin(ax) + z3 * Math.cos(ax);

    } else {
      // Idle — pomalý klidný drift
      const x3 = R * Math.cos(ph);
      const y3 = R * Math.sin(ph) * tl;
      const z3 = R * Math.sin(ph) * (1 - tl);
      x = x3 * Math.cos(ax) - z3 * Math.sin(ax);
      y = y3;
      z = x3 * Math.sin(ax) + z3 * Math.cos(ax);
    }

    posArr.setXYZ(i, x, y, z);

    // Jas podle z-hloubky
    const zn    = (z / (R * 1.5) + 1) / 2;
    const alpha = 0.12 + zn * 0.78;
    colArr.setXYZ(i,
      curColor.r * alpha,
      curColor.g * alpha,
      curColor.b * alpha
    );
  }

  posArr.needsUpdate = true;
  colArr.needsUpdate = true;

  // Plynulá změna rychlosti rotace
  rotSpeed += (cfg.speed * 0.0014 - rotSpeed) * 0.06;
  pts.rotation.y   += rotSpeed;
  ring.rotation.y   = pts.rotation.y * 0.28;
  ring.rotation.x   = 0.32 + Math.sin(ts * 0.5) * 0.08;
  ring2.rotation.y  = -pts.rotation.y * 0.18;
  ring2.rotation.z  = ts * 0.12;

  // Barva ringu podle stavu
  ringMat.color.set(curColor);
  ringMat.opacity = 0.12 + 0.07 * Math.abs(Math.sin(ts * cfg.speed));

  renderer.render(scene, camera);
}
animate(0);

// ── SET STATE ─────────────────────────────────────────
const stateLabel = document.getElementById('state-label');

function setState(s) {
  currentState = s;
  const cfg = ORB_STATE[s] || ORB_STATE.idle;
  tgtColor.set(cfg.color);
  const css = CSS_STATE[s] || CSS_STATE.idle;
  stateLabel.textContent = css.label;
  stateLabel.style.color = css.css;
}

// ── WEBSOCKET ─────────────────────────────────────────
const chat     = document.getElementById('chat');
const progress = document.getElementById('progress-inner');
const input    = document.getElementById('text-input');
const sendBtn  = document.getElementById('send-btn');
const dot      = document.getElementById('status-dot');
const statusTx = document.getElementById('status-text');
const modelLbl = document.getElementById('model-label');
const micIcon  = document.getElementById('mic-icon');
const micWrap  = document.getElementById('mic-wrap');

let ws, ttsOn = true, streamBubble = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen  = () => { dot.style.background='#00e5ff'; statusTx.textContent='ONLINE'; };
  ws.onclose = () => { dot.style.background='#ef5350'; statusTx.textContent='OFFLINE';
                       setTimeout(connect, 2000); };
  ws.onerror = () => { dot.style.background='#ef5350'; statusTx.textContent='CHYBA'; };
  ws.onmessage = e => handle(JSON.parse(e.data));
}

function handle(d) {
  switch (d.type) {
    case 'state':
      setState(d.state);
      if (d.state === 'thinking') {
        progress.classList.add('active'); sendBtn.disabled = true;
        micIcon.textContent = '⏳'; micWrap.style.borderColor = 'var(--orb-thinking)';
      } else if (d.state === 'listening') {
        micIcon.textContent = '⏹'; micWrap.style.borderColor = 'var(--orb-listening)';
      } else if (d.state === 'speaking') {
        micIcon.textContent = '🔊'; micWrap.style.borderColor = 'var(--orb-speaking)';
      } else {
        progress.classList.remove('active'); sendBtn.disabled = false;
        micIcon.textContent = '🎤'; micWrap.style.borderColor = 'var(--cyan)';
      }
      break;
    case 'info':
      modelLbl.textContent = d.model || '—'; break;
    case 'message':
      if (d.role === 'user')   addMsg('user',   '🧑', d.text);
      else if (d.role==='jarvis') addMsg('jarvis','🤖', d.text);
      break;
    case 'stream_start':
      streamBubble = createStream(); break;
    case 'stream_chunk':
      streamBubble ? appendChunk(streamBubble, d.text) : addMsg('jarvis','🤖',d.text); break;
    case 'stream_end':
      if (streamBubble) { streamBubble.classList.remove('stream-cursor'); streamBubble=null; }
      break;
    case 'audio':
      if (ttsOn) playAudio(d.url); break;
    case 'action':
      addInfo(`↳ akce: ${d.action}`); break;
    case 'result':
      addInfo(`↳ ${d.text}`); break;
    case 'cleared':
      chat.innerHTML=''; addSystem('Paměť vymazána.'); break;
  }
}

// ── CHAT HELPERS ──────────────────────────────────────
function ts() {
  const d=new Date();
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function fmt(t) {
  return t.replace(/```[\s\S]*?```/g, m=>{
    const code=m.replace(/```\w*\n?/,'').replace(/```$/,'');
    return `<pre><code>${esc(code)}</code></pre>`;
  }).replace(/`([^`]+)`/g,'<code>$1</code>');
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMsg(role, emoji, text) {
  const d=document.createElement('div'); d.className=`msg ${role}`;
  const meta=document.createElement('div'); meta.className='msg-meta';
  meta.innerHTML=`<span>${emoji} ${role==='user'?'TY':'JARVIS'}</span><span>${ts()}</span>`;
  const b=document.createElement('div'); b.className='bubble';
  b.innerHTML=fmt(text);
  d.appendChild(meta); d.appendChild(b);
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return b;
}

function addSystem(t){ const d=document.createElement('div'); d.className='msg system';
  const b=document.createElement('div'); b.className='bubble'; b.textContent=t;
  d.appendChild(b); chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }

function addInfo(t){ const d=document.createElement('div'); d.className='msg info';
  const b=document.createElement('div'); b.className='bubble'; b.textContent=t;
  d.appendChild(b); chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }

function createStream(){
  const d=document.createElement('div'); d.className='msg jarvis';
  const meta=document.createElement('div'); meta.className='msg-meta';
  meta.innerHTML=`<span>🤖 JARVIS</span><span>${ts()}</span>`;
  const b=document.createElement('div'); b.className='bubble stream-cursor';
  d.appendChild(meta); d.appendChild(b); chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight; return b;
}

function appendChunk(b, text){
  b.classList.remove('stream-cursor');
  b.innerHTML+=fmt(text)+' ';
  b.classList.add('stream-cursor');
  chat.scrollTop=chat.scrollHeight;
}

// ── AUDIO ─────────────────────────────────────────────
let curAudio=null;
function playAudio(url){
  if(curAudio){curAudio.pause();curAudio=null;}
  const a=new Audio(url); curAudio=a;
  a.onended=()=>{curAudio=null;};
  a.onerror=()=>{curAudio=null;};
  a.play().catch(()=>{});
}

// ── ODESLÁNÍ ──────────────────────────────────────────
function send(){
  const t=input.value.trim();
  if(!t||!ws||ws.readyState!==1) return;
  input.value=''; ws.send(JSON.stringify({type:'message',text:t}));
}

input.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
sendBtn.addEventListener('click', send);

// Mic (jen UI — aktivuje TTS listening přes backend)
micWrap.addEventListener('click', ()=>{
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'listen'}));
});

// ── TOOLBAR ───────────────────────────────────────────
document.getElementById('tts-btn').addEventListener('click', function(){
  ttsOn=!ttsOn; this.classList.toggle('active',ttsOn);
  this.textContent=ttsOn?'🔊 HLAS':'🔇 HLAS';
});
document.getElementById('clear-btn').addEventListener('click',()=>{
  chat.innerHTML=''; addSystem('Log vymazán.');
});
document.getElementById('memory-btn').addEventListener('click',()=>{
  if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'clear'}));
});

// Mezerník = odesli
document.addEventListener('keydown', e=>{
  if(e.code==='Space'&&document.activeElement!==input){
    e.preventDefault();
    if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'listen'}));
  }
});

connect();
addSystem('JARVIS v3.0 připraven.');
setInterval(()=>{ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'ping'})); },30000);
</script>
</body>
</html>
