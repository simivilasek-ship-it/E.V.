<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS v3.0</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #b06d00;
    --goldh:  #c87f10;
    --bg:     #0a0807;
    --bg2:    #131009;
    --bg3:    #1c1710;
    --fg:     #f0ead8;
    --muted:  #666;
    --green:  #4caf50;
    --red:    #e53935;
    --blue:   #64b5f6;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── LAYOUT ─────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER / ORB ────────────────────────────── */
  #orb-section {
    position: relative;
    flex: 0 0 44vh;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1208 0%, var(--bg) 70%);
  }

  #orb-canvas {
    display: block;
    cursor: default;
  }

  #title {
    position: absolute;
    top: 18px;
    left: 28px;
    font-family: Georgia, serif;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(176,109,0,0.4);
  }

  #status-dot {
    position: absolute;
    top: 22px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  #status-dot span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    transition: background 0.4s;
  }

  #state-label {
    position: absolute;
    bottom: 14px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    transition: color 0.5s, opacity 0.3s;
  }

  /* ── DIVIDER ─────────────────────────────────── */
  .divider {
    height: 1px;
    background: var(--gold);
    opacity: 0.4;
    flex-shrink: 0;
  }

  /* ── TOOLBAR ─────────────────────────────────── */
  #toolbar {
    flex: 0 0 36px;
    background: var(--bg2);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }

  .tb-btn {
    background: #1e1a14;
    border: none;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .tb-btn:hover { background: #2a2318; color: var(--fg); }
  .tb-btn.active { background: var(--gold); color: #0a0807; }

  #model-label {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
  }

  /* ── CHAT ────────────────────────────────────── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 4px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: #2a2318; border-radius: 2px; }

  .msg {
    padding: 6px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .msg-meta {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Uživatelské zprávy — vpravo */
  .msg.user { align-items: flex-end; }
  .msg.user .msg-meta { flex-direction: row-reverse; }
  .msg.user .msg-bubble {
    background: #1e1a10;
    border: 1px solid #2a2318;
    border-radius: 14px 14px 4px 14px;
    color: var(--fg);
    text-align: right;
  }

  /* JARVIS zprávy — vlevo */
  .msg.jarvis { align-items: flex-start; }
  .msg.jarvis .msg-bubble {
    background: #121009;
    border: 1px solid rgba(176,109,0,0.25);
    border-radius: 14px 14px 14px 4px;
    color: #ffe0a0;
  }

  /* Systémové zprávy — center */
  .msg.system { align-items: center; }
  .msg.system .msg-bubble {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  .msg-bubble {
    max-width: 78%;
    padding: 8px 14px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Kódové bloky */
  .msg-bubble code, .msg-bubble pre {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    color: #a8d8a8;
    background: #0d120d;
    border-radius: 4px;
    padding: 2px 6px;
    display: block;
    margin: 4px 0;
    white-space: pre;
    overflow-x: auto;
  }

  /* Info zprávy */
  .msg.info .msg-bubble {
    background: transparent;
    border: none;
    color: var(--blue);
    font-size: 11px;
  }
  .msg.error .msg-bubble { color: var(--red); font-size: 11px; }
  .msg.success .msg-bubble { color: var(--green); font-size: 11px; }

  /* Streaming kurzor */
  .stream-cursor::after {
    content: '▋';
    animation: blink 0.7s step-end infinite;
    color: var(--gold);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── PROGRESS BAR ────────────────────────────── */
  #progress-bar {
    height: 2px;
    background: var(--bg);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  #progress-inner {
    height: 100%;
    width: 30%;
    background: var(--gold);
    position: absolute;
    left: -30%;
    transition: opacity 0.3s;
    opacity: 0;
  }
  #progress-inner.active {
    opacity: 1;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { left: -30%; }
    100% { left: 110%; }
  }

  /* ── INPUT ───────────────────────────────────── */
  #input-area {
    flex: 0 0 60px;
    background: var(--bg2);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    border-top: 1px solid rgba(176,109,0,0.2);
  }

  #text-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid rgba(176,109,0,0.5);
    border-radius: 8px;
    color: var(--fg);
    font-size: 14px;
    font-family: inherit;
    padding: 10px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  #text-input:focus { border-color: var(--gold); }
  #text-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--gold);
    border: none;
    color: #0a0807;
    width: 42px; height: 42px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  #send-btn:hover { background: var(--goldh); }
  #send-btn:disabled { background: #333; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">

  <!-- ORB SEKCE -->
  <div id="orb-section">
    <div id="title">J A R V I S</div>
    <div id="status-dot"><span id="dot"></span><span id="status-text">Připojování...</span></div>
    <canvas id="orb-canvas"></canvas>
    <div id="state-label">IDLE</div>
  </div>

  <!-- TOOLBAR -->
  <div class="divider"></div>
  <div id="toolbar">
    <button class="tb-btn active" id="tts-btn">🔊 TTS</button>
    <button class="tb-btn" id="clear-btn">🗑 Log</button>
    <button class="tb-btn" id="memory-btn">🧠 Paměť</button>
    <span id="model-label">—</span>
  </div>
  <div class="divider"></div>

  <!-- CHAT -->
  <div id="chat"></div>

  <!-- PROGRESS BAR -->
  <div id="progress-bar"><div id="progress-inner"></div></div>

  <!-- INPUT -->
  <div id="input-area">
    <input id="text-input" type="text" placeholder="Napiš příkaz pro JARVIS..." autocomplete="off" />
    <button id="send-btn">↵</button>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── KONFIGURACE ──────────────────────────────────────
const PARTICLE_COUNT = 700;
const GOLD_COLOR = new THREE.Color(0xb06d00);

const STATE_CFG = {
  idle:      { color: 0xb06d00, speed: 0.18, spread: 1.6, orbitFactor: 0.25 },
  listening: { color: 0xe53935, speed: 0.55, spread: 1.1, orbitFactor: 0.05 },
  thinking:  { color: 0x64b5f6, speed: 1.4,  spread: 1.9, orbitFactor: 1.4  },
  speaking:  { color: 0x4caf50, speed: 0.85, spread: 2.1, orbitFactor: 0.7  },
};

// ── THREE.JS SETUP ───────────────────────────────────
const canvas   = document.getElementById('orb-canvas');
const section  = document.getElementById('orb-section');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 100);
camera.position.z = 4.5;

// ── PARTICLE GEOMETRY ────────────────────────────────
const geometry  = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors    = new Float32Array(PARTICLE_COUNT * 3);
const baseR     = new Float32Array(PARTICLE_COUNT);
const phase     = new Float32Array(PARTICLE_COUNT);
const speed_arr = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  // Rozmístění na sféře (Fibonacci)
  const golden = Math.PI * (3 - Math.sqrt(5));
  const y  = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
  const r  = Math.sqrt(1 - y * y);
  const th = golden * i;
  const R  = 1.3 + Math.random() * 0.6;

  positions[i*3]   = R * r * Math.cos(th);
  positions[i*3+1] = R * y;
  positions[i*3+2] = R * r * Math.sin(th);

  baseR[i]     = R;
  phase[i]     = Math.random() * Math.PI * 2;
  speed_arr[i] = 0.4 + Math.random() * 0.6;

  const c = GOLD_COLOR;
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.042,
  vertexColors: true,
  transparent: true,
  opacity: 0.88,
  sizeAttenuation: true,
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// Vnější glow ring
const ringGeo = new THREE.TorusGeometry(2.2, 0.008, 8, 120);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xb06d00, transparent: true, opacity: 0.15 });
const ring    = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring);

// ── STAV ─────────────────────────────────────────────
let currentState    = 'idle';
let targetColor     = new THREE.Color(0xb06d00);
let currentColor    = new THREE.Color(0xb06d00);
let shockwaveRadius = 0;
let shockwaveActive = false;
let rotSpeed        = 0.001;

// ── RESIZE ────────────────────────────────────────────
function resize() {
  const w = section.clientWidth;
  const h = section.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
new ResizeObserver(resize).observe(section);

// ── ANIMACE ───────────────────────────────────────────
let lastT = 0;
function animate(t) {
  requestAnimationFrame(animate);

  const dt  = t - lastT;
  lastT = t;
  const cfg = STATE_CFG[currentState] || STATE_CFG.idle;

  // Plynulý přechod barvy
  currentColor.lerp(targetColor, 0.04);

  const pos = geometry.attributes.position;
  const col = geometry.attributes.color;

  const ts = t * 0.001;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const ph  = phase[i];
    const sp  = speed_arr[i] * cfg.speed;
    const R   = baseR[i] * cfg.spread;

    let x, y, z;

    if (currentState === 'thinking') {
      // Elektronové orbitální dráhy
      const orbit = ph * 3 + ts * sp * 2;
      const tilt  = ph * Math.PI;
      const puls  = 1 + 0.12 * Math.sin(ts * 2 + ph);
      x = R * puls * Math.sin(tilt) * Math.cos(orbit);
      y = R * puls * Math.sin(tilt) * Math.sin(orbit);
      z = R * puls * Math.cos(tilt) + 0.3 * Math.sin(ts * 3 + ph);

    } else if (currentState === 'speaking') {
      // Vortex + shockwave
      const vortexT = ts * sp + ph;
      const height  = ((i / PARTICLE_COUNT) - 0.5) * 3.2;
      const vortexR = R * 0.55 * (1 + 0.15 * Math.sin(ts * 2));
      x = vortexR * Math.cos(vortexT * 2 + height * 0.4);
      y = height  + 0.2 * Math.sin(ts * 3 + ph);
      z = vortexR * Math.sin(vortexT * 2 + height * 0.4);

    } else if (currentState === 'listening') {
      // Pulzující stlačená sféra
      const pulse = 1 + 0.08 * Math.sin(ts * 3 + ph);
      const th2   = ph * Math.PI * 2;
      const phi2  = Math.acos(Math.max(-1, Math.min(1, 1 - (i / PARTICLE_COUNT) * 2)));
      const Rp    = R * 0.72 * pulse;
      x = Rp * Math.sin(phi2) * Math.cos(th2);
      y = Rp * Math.sin(phi2) * Math.sin(th2);
      z = Rp * Math.cos(phi2);

    } else {
      // Idle — pomalý klidný drift po sféře
      const drift = ts * sp * 0.4 + ph;
      const phi3  = ph * Math.PI + 0.1 * Math.sin(ts * 0.3 + ph);
      const th3   = drift;
      const Ri    = R * (1 + 0.05 * Math.sin(ts + ph * 2));
      x = Ri * Math.sin(phi3) * Math.cos(th3);
      y = Ri * Math.sin(phi3) * Math.sin(th3);
      z = Ri * Math.cos(phi3);
    }

    pos.setXYZ(i, x, y, z);
    col.setXYZ(i, currentColor.r, currentColor.g, currentColor.b);
  }

  pos.needsUpdate = true;
  col.needsUpdate = true;

  // Rotace celé sféry
  rotSpeed += (cfg.speed * 0.0015 - rotSpeed) * 0.05;
  points.rotation.y += rotSpeed;
  ring.rotation.y    = points.rotation.y * 0.3;
  ring.rotation.x    = 0.3 + Math.sin(ts * 0.5) * 0.1;

  // Barva ringu
  ringMat.color.copy(currentColor);
  ringMat.opacity = 0.1 + 0.08 * Math.abs(Math.sin(ts * cfg.speed));

  renderer.render(scene, camera);
}
animate(0);

// ── NASTAVENÍ STAVU ───────────────────────────────────
const stateLabel = document.getElementById('state-label');
const stateNames = { idle:'IDLE', listening:'POSLOUCHÁM', thinking:'PŘEMÝŠLÍM', speaking:'MLUVÍM' };
const stateColors = { idle:'#b06d00', listening:'#e53935', thinking:'#64b5f6', speaking:'#4caf50' };

function setState(state) {
  currentState = state;
  const cfg = STATE_CFG[state] || STATE_CFG.idle;
  targetColor.set(cfg.color);
  stateLabel.textContent = stateNames[state] || state.toUpperCase();
  stateLabel.style.color = stateColors[state] || '#b06d00';
}

// ── WEBSOCKET ─────────────────────────────────────────
const dot      = document.getElementById('dot');
const statusTx = document.getElementById('status-text');
const modelLbl = document.getElementById('model-label');
const chat     = document.getElementById('chat');
const progress = document.getElementById('progress-inner');
const input    = document.getElementById('text-input');
const sendBtn  = document.getElementById('send-btn');

let ws, ttsEnabled = true, streamBubble = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    dot.style.background = '#4caf50';
    statusTx.textContent = 'Online';
  };

  ws.onclose = () => {
    dot.style.background = '#e53935';
    statusTx.textContent = 'Odpojeno';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    dot.style.background = '#e53935';
    statusTx.textContent = 'Chyba';
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleMessage(data);
  };
}

function handleMessage(data) {
  switch (data.type) {

    case 'state':
      setState(data.state);
      if (data.state === 'thinking') {
        progress.classList.add('active');
        sendBtn.disabled = true;
      } else {
        progress.classList.remove('active');
        sendBtn.disabled = false;
      }
      break;

    case 'info':
      modelLbl.textContent = data.model || '—';
      break;

    case 'message':
      if (data.role === 'user') {
        addMsg('user', '🧑', 'TY', data.text);
      } else if (data.role === 'jarvis') {
        addMsg('jarvis', '🤖', 'JARVIS', data.text);
      }
      break;

    case 'stream_start':
      streamBubble = createStreamBubble();
      break;

    case 'stream_chunk':
      if (streamBubble) appendStreamChunk(streamBubble, data.text);
      else addMsg('jarvis', '🤖', 'JARVIS', data.text);
      break;

    case 'stream_end':
      if (streamBubble) {
        streamBubble.classList.remove('stream-cursor');
        streamBubble = null;
      }
      break;

    case 'audio':
      if (ttsEnabled) playAudio(data.url);
      break;

    case 'action':
      addMsg('info', '', '', `↳ akce: ${data.action}`);
      break;

    case 'result':
      addMsg('info', '', '', `↳ ${data.text}`);
      break;

    case 'cleared':
      chat.innerHTML = '';
      addSystemMsg('Paměť rozhovoru vymazána.');
      break;
  }
}

// ── CHAT HELPERS ──────────────────────────────────────
function ts() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function formatText(text) {
  // Zvýraznění kódu
  return text.replace(/```[\s\S]*?```/g, m => {
    const code = m.replace(/```\w*\n?/, '').replace(/```$/, '');
    return `<pre><code>${escHtml(code)}</code></pre>`;
  }).replace(/`([^`]+)`/g, '<code>$1</code>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMsg(role, emoji, label, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  if (role !== 'system' && role !== 'info' && role !== 'error' && role !== 'success') {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `<span>${emoji} ${label}</span><span>${ts()}</span>`;
    div.appendChild(meta);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = formatText(text);
  div.appendChild(bubble);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  const b = document.createElement('div');
  b.className = 'msg-bubble';
  b.textContent = text;
  div.appendChild(b);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function createStreamBubble() {
  const div = document.createElement('div');
  div.className = 'msg jarvis';

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span>🤖 JARVIS</span><span>${ts()}</span>`;
  div.appendChild(meta);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble stream-cursor';
  div.appendChild(bubble);

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function appendStreamChunk(bubble, text) {
  bubble.classList.remove('stream-cursor');
  bubble.innerHTML += formatText(text) + ' ';
  bubble.classList.add('stream-cursor');
  chat.scrollTop = chat.scrollHeight;
}

// ── AUDIO ─────────────────────────────────────────────
let currentAudio = null;

function playAudio(url) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  setState('speaking');
  const audio = new Audio(url);
  currentAudio = audio;
  audio.onended = () => {
    currentAudio = null;
    setState('idle');
  };
  audio.onerror = () => setState('idle');
  audio.play().catch(() => setState('idle'));
}

// ── ODESLÁNÍ ZPRÁVY ───────────────────────────────────
function sendMessage() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  input.value = '';
  ws.send(JSON.stringify({ type: 'message', text }));
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

// ── TOOLBAR BUTTONS ───────────────────────────────────
document.getElementById('tts-btn').addEventListener('click', function() {
  ttsEnabled = !ttsEnabled;
  this.classList.toggle('active', ttsEnabled);
  this.textContent = ttsEnabled ? '🔊 TTS' : '🔇 TTS';
});

document.getElementById('clear-btn').addEventListener('click', () => {
  chat.innerHTML = '';
  addSystemMsg('Log vymazán.');
});

document.getElementById('memory-btn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'clear' }));
  }
});

// ── START ─────────────────────────────────────────────
connect();
addSystemMsg('JARVIS v3.0 připraven. Napiš příkaz.');

// Ping každých 30s pro udržení spojení
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 30000);
</script>
</body>
</html>
