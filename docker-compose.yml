# E.V. v5.15.0 — Docker Compose
# Spuštění: docker compose up -d
# Web UI: http://localhost:8002/app
# Vyžaduje JARVIS_API_TOKEN v .env (auth zapnuto ve výchozím stavu)

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - jarvis_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 8g
    memswap_limit: 8g
    cpus: "4.0"

  jarvis:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - JARVIS_HEADLESS=1
      - JARVIS_BIND_HOST=0.0.0.0
      - JARVIS_API_AUTH_REQUIRED=1
    env_file:
      - .env          # BRAVE_API_KEY atd.
    volumes:
      - jarvis_memory:/app/memory_data
    restart: unless-stopped
    networks:
      - jarvis_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false   # set to true once we verify tmpfs covers all write paths
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
      - /app/__pycache__:size=64m
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ollama_data:
  jarvis_memory:

networks:
  jarvis_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
