# JARVIS v5.12.0 — Docker Compose
# Spuštění: docker compose up -d
# Web UI: http://localhost:8002/app
# Vyžaduje JARVIS_API_TOKEN v .env (auth zapnuto ve výchozím stavu)

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3

  jarvis:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - JARVIS_HEADLESS=1
      - JARVIS_BIND_HOST=0.0.0.0
      - JARVIS_API_AUTH_REQUIRED=1
    env_file:
      - .env          # BRAVE_API_KEY atd.
    volumes:
      - jarvis_memory:/app/memory_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama_data:
  jarvis_memory:
