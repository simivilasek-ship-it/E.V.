# JARVIS v4.3 — Docker Compose
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3

  jarvis:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    volumes:
      - jarvis_memory:/app/memory_data
      - jarvis_config:/app/config.json
    restart: unless-stopped

  # Desktop mód — přidej GUI přes X11 (Linux only)
  # jarvis-desktop:
  #   build: .
  #   command: python jarvis.py
  #   environment:
  #     - DISPLAY=${DISPLAY}
  #   volumes:
  #     - /tmp/.X11-unix:/tmp/.X11-unix:rw
  #   devices:
  #     - /dev/snd:/dev/snd
  #   network_mode: host

volumes:
  ollama_data:
  jarvis_memory:
  jarvis_config:
