[pytest]
# JARVIS pytest configuration

pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimální verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Timeout pro testy (5 sekund)
timeout = 5

# Markers
markers =
    unit: Unit testy
    integration: Integrační testy
    slow: Pomalé testy
    requires_ollama: Vyžaduje běžící Ollama
    requires_mic: Vyžaduje mikrofon
