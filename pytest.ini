[pytest]
# JARVIS pytest configuration

pythonpath = .
testpaths = tests test_jarvis.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimální verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Timeout — CI uses 30s; 5s caused false failures on scheduler/API tests
timeout = 30

# Markers
markers =
    unit: Unit testy
    integration: Integrační testy
    slow: Pomalé testy
    requires_ollama: Vyžaduje běžící Ollama
    requires_mic: Vyžaduje mikrofon
    e2e: End-to-end tests with minimal mocks
